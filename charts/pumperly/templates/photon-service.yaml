{{- if .Values.photon.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pumperly.photon.fullname" . }}
  labels:
    {{- include "pumperly.labels" . | nindent 4 }}
    app.kubernetes.io/component: photon
spec:
  type: ClusterIP
  ports:
    - port: 2322
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "pumperly.photon.selectorLabels" . | nindent 4 }}
{{- end }}
