name: Auto Tag

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'docker/**'
      - '.github/workflows/auto-tag.yml'

concurrency:
  group: auto-tag
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tag:
    name: Bump version
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Get latest tag and bump version
        id: bump
        run: |
          LATEST=$(git tag -l "v*" --sort=-version:refname | head -1)
          if [ -z "$LATEST" ]; then
            echo "new_tag=v0.0.1" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Strip v prefix, split into major.minor.patch
          VERSION="${LATEST#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          # Determine bump type from conventional commits in ${LATEST}..HEAD:
          #   - breaking change (BREAKING CHANGE in body, or "!" before the colon
          #     e.g. feat!: / fix!:) -> bump MAJOR, reset minor+patch to 0
          #   - feat: commit                                  -> bump MINOR, reset patch to 0
          #   - anything else (fix:, chore:, etc.)            -> bump PATCH
          # The previous "[skip ci]" chore bump commit is at/before LATEST, so
          # scanning ${LATEST}..HEAD correctly excludes it from feat detection.
          COMMITS=$(git log --format=%B "${LATEST}..HEAD")
          if echo "$COMMITS" | grep -qE '(^|[[:space:]])BREAKING CHANGE|^[a-zA-Z]+(\([^)]*\))?!:'; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif echo "$COMMITS" | grep -qE '^feat'; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          echo "new_tag=v${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

      - name: Sync package.json version and create tag
        run: |
          NEW_TAG="${{ steps.bump.outputs.new_tag }}"
          VERSION="${NEW_TAG#v}"
          # Tag the current HEAD (the actual code) BEFORE the version bump.
          # This ensures the tag points to a commit without [skip ci],
          # so the tag push triggers Docker Publish.
          git tag "$NEW_TAG"
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: bump version to $NEW_TAG [skip ci]"
            git push origin main
          fi
          git push origin "$NEW_TAG"
