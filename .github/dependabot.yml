version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      npm_security:
        applies-to: security-updates
        patterns:
          - '*'
    reviewers:
      - GeiserX
    ignore:
      # TypeScript 7 is the native (Go) compiler port. Next.js and
      # typescript-eslint don't support it yet: `tsc --noEmit` crashes
      # (TypeError reading 'Cjs') and `next build` fails because the native
      # port doesn't expose the programmatic TS API those tools consume.
      # Stay on the TypeScript 6.x line until the toolchain catches up; drop
      # this ignore once Next.js + typescript-eslint declare TS 7 support (#82).
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: docker
    labels:
      - dependencies
      - automated
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      docker-security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
  # github-actions: now SHA-pinned in workflows, so Dependabot keeps the pins
  # current. NO semver-major ignore block here — pins must not silently freeze
  # on major bumps (that caused org-wide action drift previously).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
      github_actions_security:
        applies-to: security-updates
        patterns:
          - '*'
    reviewers:
      - GeiserX
